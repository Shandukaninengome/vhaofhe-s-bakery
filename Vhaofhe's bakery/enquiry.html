<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Enquiry | Vhaofhe's Bakery</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- HEADER -->
    <header>

        <div class="header-inner">

            <a href="index.html" class="logo">
                Vhaofhe's Bakery
            </a>

            <nav>

                <a href="index.html">
                    Home
                </a>

                <a href="about.html">
                    About Us
                </a>

                <a href="products.html">
                    Products
                </a>

                <a href="enquiry.html">
                    Enquiry
                </a>

                <a href="contact.html">
                    Contact
                </a>

            </nav>

        </div>

    </header>


    <!-- MAIN -->
    <main>


        <!-- PAGE INTRO -->
        <section class="page-intro">

            <p class="eyebrow">
                We'd love to hear from you
            </p>

            <h1>
                Make an Enquiry
            </h1>

            <p>
                Complete the form below and Vhaofhe's Bakery
                will get back to you.
            </p>

        </section>


        <!-- FORM -->
        <section class="form-section">

            <form action="#" method="post">


                <div class="form-grid">


                    <!-- NAME -->
                    <div class="form-group">

                        <label for="full-name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="full-name"
                            name="full-name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            required
                        >

                    </div>


                    <!-- PHONE -->
                    <div class="form-group">

                        <label for="phone">
                            Telephone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your telephone number"
                        >

                    </div>


                    <!-- PRODUCT -->
                    <div class="form-group">

                        <label for="product">
                            Product
                        </label>

                        <select
                            id="product"
                            name="product"
                        >

                            <option value="">
                                Select a product
                            </option>

                            <option>
                                Cake Slice
                            </option>

                            <option>
                                Cupcakes
                            </option>

                            <option>
                                Strawberry Cake
                            </option>

                            <option>
                                Chocolate Cake
                            </option>

                            <option>
                                Pink Ice Cream Shake
                            </option>

                            <option>
                                Assorted Rolls
                            </option>

                            <option>
                                Pastries
                            </option>

                            <option>
                                Oreo Cupcakes
                            </option>

                            <option>
                                Strawberry Milkshake
                            </option>

                            <option>
                                Vanilla Cupcakes
                            </option>

                            <option>
                                Strawberry Smoothie
                            </option>

                            <option>
                                Vanilla Cake
                            </option>

                            <option>
                                Oreo Milkshake
                            </option>

                            <option>
                                Cinnamon Rolls
                            </option>

                            <option>
                                Blueberry Cheesecake
                            </option>

                        </select>

                    </div>


                </div>


                <!-- MESSAGE -->
                <div class="form-group">

                    <label for="message">
                        Your Enquiry
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="7"
                        placeholder="Tell us what you would like to order or ask about..."
                        required
                    ></textarea>

                </div>


                <!-- SUBMIT -->
                <button
                    class="button"
                    type="submit"
                >
                    Submit Enquiry
                </button>


            </form>

        </section>


    </main>


    <!-- FOOTER -->
    <footer>

        <p>
            &copy; 2026 Vhaofhe's Bakery.
            All rights reserved.
        </p>

    </footer>


</body>
</html>
